<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario Produto Adrián</title>
<script defer src=".././javascript/bundle.js"></script><link href=".././css/main.css" rel="stylesheet"></head>
<body>
    <H2>Engadir producto</H2>
    <form id="form-adrian">
        <input type="text" name="nome" placeholder="Nome do produto" required/>
        <input type="text" name="codigo" placeholder="Código" required/>
        <input type="text" name="stock" placeholder="Stock" required/>
        <input type="text" name="prezo" placeholder="Prezo" required/>
        <button type="submit" id="envio-produto-adrian">Enviar</button>
    </form>
    <div id="resposta"></div>
</body>
</html>
