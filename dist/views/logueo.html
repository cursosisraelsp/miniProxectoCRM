<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css" />
</head>

<body>
    <h1>Inicio de sesión</h1>
    <form method="post" action="/paxina-app">
        <input name="nome2" type="text" placeholder="introduce o teu nome 2" />
        <input name="apelido2" type="text" placeholder="introduce o teu apelido 2" />
        <button id="envio2">enviar</button>
    </form>

    <h1>Ou cre un usuario novo se non está rexistrado</h1>
    <form id="formulario-usuario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="contrasinal">Contrasinal:</label>
        <input type="password" id="contrasinal" name="contrasinal" required><br>

        <button type="submit">Crear Usuario</button>
    </form>

    <script type="module">
        import { ComunicacionCrearUsuario } from "../javascript/bundle.js";

        document
            .getElementById("formulario-usuario")
            .addEventListener("submit", async (e) => {
                e.preventDefault();
                await ComunicacionCrearUsuario();
            });
    </script>

</body>

</html>
