<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Product</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <h2>Settings Products</h2>
    <div class="navbar-icons">
      <img src="../imaxenes/product-adr/Notifications.png" alt="Notificaciones" />
      <img src="../imaxenes/product-adr/Profile.png" alt="Usuario" />
    </div>
  </header>

  <aside class="sidebar">
    <img src="../imaxenes/product-adr/Oval.png" class="logo" alt="Logo" />
    <nav>
      <a href="#"><img src="../imaxenes/product-adr/Home.png" alt="Home" /></a>
      <a href="#"><img src="../imaxenes/product-adr/Persoas.png" alt="Clientes" /></a>
      <a href="#"><img src="../imaxenes/product-adr/Rectangle.png" alt="Facturas" /></a>
      <a href="#"><img src="../imaxenes/product-adr/Shape.png" alt="Ajustes" /></a>
    </nav>
  </aside>

  <main class="main-content">
    <section class="form-card">
      <div class="form-left">
        <h3>Products</h3>
        <img src="../imaxenes/product-adr/product-box.png" class="product-img" alt="Producto" />
        <button class="btn dark">Change picture</button>
        <button class="btn light">Delete picture</button>
        <form>
          <div class="form-grid">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome" />

            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Código" />

            <label for="stock">Stock</label>
            <input type="number" id="stock" placeholder="Stock" />

            <label for="tipo">Tipo</label>
            <input type="text" id="tipo" placeholder="Tipo" />

            <label for="peso">Peso</label>
            <input type="text" id="peso" placeholder="Peso" />

            <label for="precio">Precio</label>
            <input type="text" id="precio" placeholder="Precio" />
          </div>
        </form>
      </div>
      <div class="form-right">
        <img src="../imaxenes/product-adr/settings.png" class="engranaje-img" alt="Engranaje" />
        <button class="btn send">Send</button>
      </div>
    </section>
  </main>
</body>
</html>
