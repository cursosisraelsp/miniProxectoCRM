<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./css/main.css" />
    
</head>
<body name="logueo">
    <aside>
        <img src="./imaxenes/menuImg0.svg" alt="Menu Item 1">
        <a href="/home"><img src="./imaxenes/menuImg1.svg" alt="Menu Item 2"></a>
        <a href="/customers"><img src="./imaxenes/menuImg2.svg" alt="Menu Item 3"></a>
        <a href="/invoice"><img src="./imaxenes/menuImg3.svg" alt="Menu Item 4"></a>
        <a href="../page4.html"><img src="./imaxenes/menuImg4.svg" alt="Menu Item 5"></a>
    </aside>
    <main>
        <header>
            <img src="./imaxenes/Search.svg" alt="Search">
            <div id="divHeader">
                <img src="./imaxenes/Notifications.svg" alt="Notifications">
                <img src="./imaxenes/Profile.svg" alt="Profile">
            </div>
        </header>
        <section class="section-paxinas">
            
            <section class="main-section">
                
                <form name="formulario-logueo" id="login-form">
                    <input name="login" type="text" placeholder="Usuario" class="login-input">
                    <input name="psw" type="password" placeholder="Contraseña" class="login-input">
                    <button name="logueo" id="login-button">Iniciar Sesión</button>
                </form>

            </section>
        </section>
    </main>
</body>
</html>
